name: Update solved problems

on:
  schedule:
    - cron: "17 * * * *"   # 매시간 17분 (정각은 실행이 몰려 지연되기 쉬움)
  workflow_dispatch:         # 수동 실행 버튼 + algorithm 레포가 새 문제를 올린 직후 호출

permissions:
  contents: write            # README를 커밋하기 위한 권한

concurrency:                 # 갱신 요청이 겹쳐도 한 번에 하나씩 실행
  group: update-solved
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 프로필 레포 가져오기
        uses: actions/checkout@v7

      - name: 풀이 레포 가져오기
        uses: actions/checkout@v7
        with:
          repository: Hiri-kor/algorithm
          path: algorithm

      - name: 파이썬 준비
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: README 갱신
        run: python scripts/update_readme.py algorithm/problems.json README.md

      - name: 바뀐 경우에만 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || (git commit -m "chore: 최근 푼 문제 갱신" && git pull --rebase && git push)
